# Per-cell agent containers running long-running `claude remote-control`
# sessions. Connect from the Claude mobile app's "Code" tab; each cell shows
# up as a separate session you can dispatch tasks to.
#
# Why this is separate from docker-compose.yml:
# - docker-compose.yml = colony-level *services* (atlas, morphogen) that
#   long outlive any individual development effort.
# - docker-compose.agents.yml = developer-time *agent sessions* per cell.
#   Different lifecycle, different reasons to start/stop, different
#   resource model (one per active cell, not one per service).
#
# One session per cell (`--spawn=session`); container restarts
# unless-stopped so a 10-minute network outage that ends the underlying
# remote-control session boots a fresh one automatically.
#
# Bot identity: the operator's shared GitHub App credentials at
# `~/.config/colony-bot/` are bind-mounted read-only into each container
# at `/etc/colony-bot`, and `AGENT_BOT_CRED_DIR` is set to that path so
# `dev-tools/agent-bot/{mint-token,as-bot}.sh` find the credentials with
# zero per-cell setup. The mount is read-only — the in-container agent
# can read the private key (mints installation tokens via JWT) but
# cannot modify it. Trust model: a compromised agent inside the
# container can author bot-identity commits/PRs, but operator approval
# still gates merges (branch protection enforces this).
#
# UID note: the in-container `agent` user is uid 1000. The bind-mount
# preserves host file ownership numerically. Most personal Linux setups
# have the primary user at uid 1000, so this works out of the box. If
# your host uid differs, the agent won't be able to read the chmod-600
# credential files; either chmod the host files more permissively (not
# recommended) or rebuild the image with `useradd ... --uid <your-uid>`.
#
# ---------------------------------------------------------------------
# First-run per cell (one-time, OAuth state then persists in the
# named volume):
#
#   docker compose -f docker-compose.agents.yml build
#   docker compose -f docker-compose.agents.yml run --rm agent-atlas bash
#       # inside the container:
#       claude /login                # browser opens, complete OAuth
#       exit
#
# Then bring up all sessions:
#
#   docker compose -f docker-compose.agents.yml up -d
#
# Verify each appears in the Claude mobile app's Code tab with a green dot.
#
# After that: PR merges land via your normal review flow; tap the cell's
# session in the mobile app and send "continue with the next task in the
# queue" or whatever steers the agent to the next unit of work.
#
# Tear down:
#
#   docker compose -f docker-compose.agents.yml down
#
# ---------------------------------------------------------------------
#
# NOTE on billing safety: claude inside these containers authenticates via
# `claude.ai` OAuth (subscription quota). API keys are explicitly rejected
# by Remote Control. We deliberately do NOT pass `ANTHROPIC_API_KEY` into
# the container; if you have one set in your shell, compose ignores it
# unless you list it in `environment:` here, which we don't.
# ---------------------------------------------------------------------

services:

  agent-atlas:
    build:
      context: ../atlas/dev-tools/agent-container
    image: atlas-agent:latest
    container_name: agent-atlas
    hostname: atlas-agent
    restart: unless-stopped
    working_dir: /workspace/atlas
    stdin_open: true
    tty: true
    volumes:
      - ../atlas:/workspace/atlas
      - atlas-agent-home:/home/agent
      - atlas-agent-venv-queue:/workspace/atlas/dev-tools/queue/.venv
      - ~/.config/colony-bot:/etc/colony-bot:ro
    environment:
      - AGENT_BOT_CRED_DIR=/etc/colony-bot
    # Interactive variant (`claude --remote-control NAME`), not server
    # mode (`claude remote-control --spawn=session`). Server mode prints
    # the activation banner but doesn't reliably register the session in
    # the mobile Code tab in this containerized + TTY setup; the
    # interactive variant is one session per process — exactly the shape
    # we want — and registers cleanly. Validated empirically.
    command:
      - claude
      - --remote-control
      - atlas

  agent-cytometer:
    build:
      context: ../cytometer/dev-tools/agent-container
    image: cytometer-agent:latest
    container_name: agent-cytometer
    hostname: cytometer-agent
    restart: unless-stopped
    working_dir: /workspace/cytometer
    stdin_open: true
    tty: true
    volumes:
      - ../cytometer:/workspace/cytometer
      - cytometer-agent-home:/home/agent
      - cytometer-agent-venv-queue:/workspace/cytometer/dev-tools/queue/.venv
      - ~/.config/colony-bot:/etc/colony-bot:ro
    environment:
      - AGENT_BOT_CRED_DIR=/etc/colony-bot
    # See agent-atlas comment for why interactive variant.
    command:
      - claude
      - --remote-control
      - cytometer

  # Add `agent-morphogen` here once that cell is spawned.

  agent-colony:
    build:
      context: ./dev-tools/agent-container
    image: colony-agent:latest
    container_name: agent-colony
    hostname: colony-agent
    restart: unless-stopped
    working_dir: /workspace/colony
    stdin_open: true
    tty: true
    volumes:
      - .:/workspace/colony
      - colony-agent-home:/home/agent
      - colony-agent-venv-queue:/workspace/colony/dev-tools/queue/.venv
      - ~/.config/colony-bot:/etc/colony-bot:ro
    environment:
      - AGENT_BOT_CRED_DIR=/etc/colony-bot
    # See agent-atlas comment for why interactive variant.
    command:
      - claude
      - --remote-control
      - colony

volumes:
  atlas-agent-home:
  atlas-agent-venv-queue:
  cytometer-agent-home:
  cytometer-agent-venv-queue:
  colony-agent-home:
  colony-agent-venv-queue:
